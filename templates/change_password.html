{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="container" style="max-width: 500px;">
    <h1 class="page-title">Change Password</h1>
    <p class="page-sub">Update your account security</p>

    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border);">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" required minlength="4">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required minlength="4">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Update Password</button>
        </form>
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('dashboard') }}" style="font-size: 14px; color: var(--gray);">Cancel and return</a>
    </div>
</div>
{% endblock %}
