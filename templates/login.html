<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Brothers – Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #1B1B1B; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.login-wrap { width: 100%; max-width: 400px; }
.login-header { text-align: center; margin-bottom: 32px; }
.logo { width: 64px; height: 64px; background: #52B788; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 32px; color: #1B1B1B; margin: 0 auto 16px; }
.login-header h1 { font-family: 'DM Serif Display', serif; font-size: 30px; color: #FFFFFF; font-weight: 400; }
.login-header p { color: #9CA3AF; font-size: 14px; margin-top: 6px; }
.login-card { background: #2A2A2A; border-radius: 16px; padding: 32px; border: 1px solid #3A3A3A; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 500; color: #D1D5DB; margin-bottom: 6px; }
.form-control { width: 100%; padding: 12px 14px; border: 1px solid #3A3A3A; border-radius: 8px; font-size: 14px; font-family: 'DM Sans', sans-serif; background: #1B1B1B; color: #FFFFFF; outline: none; transition: border 0.15s; }
.form-control:focus { border-color: #52B788; box-shadow: 0 0 0 3px rgba(82,183,136,0.2); }
.form-control::placeholder { color: #6B7280; }
.btn-login { width: 100%; padding: 13px; background: #2D6A4F; color: #FFFFFF; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; margin-top: 8px; }
.btn-login:hover { background: #52B788; color: #1B1B1B; }
.alert-error { background: #3B1515; color: #F87171; border: 1px solid #7F1D1D; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
.footer-note { text-align: center; font-size: 12px; color: #6B7280; margin-top: 20px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-header">
    <div class="logo">RB</div>
    <h1>Real Brothers</h1>
    <p>Community Savings Group</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert-error">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <div class="login-card">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Sign In →</button>
    </form>
  </div>
  <p class="footer-note">Contact your admin if you forgot your password.</p>
</div>
</body>
</html>
